<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account — Frankenstein</title>
  </head>
  <body>
    <main class="card">
      <h1>Create Account</h1>
      <p class="subtitle">
        My form is your form in which I shall find where to belong
      </p>

      <div id="form-banner" class="banner banner--error" role="alert" hidden></div>

      <form id="signup-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="franktein@email.com"
            autocomplete="off"
            required
          />
          <span id="email-error" class="error-msg" aria-live="polite"></span>
        </div>

        <div class="field">
          <label for="country">Country</label>
          <select id="country" name="country" autocomplete="off" required>
            <option value="">-- Select a country --</option>
          </select>
          <span id="country-error" class="error-msg" aria-live="polite"></span>
        </div>

        <div class="field">
          <label for="postal">Postal Code</label>
          <input
            id="postal"
            name="postal"
            type="text"
            placeholder="Enter a postal code..."
            autocomplete="off"
            required
          />
          <span id="postal-error" class="error-msg" aria-live="polite"></span>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            minlength="8"
            autocomplete="off"
            required
          />
          <span id="password-error" class="error-msg" aria-live="polite"></span>
        </div>

        <div class="field">
          <label for="confirm-password">Password Confirmation</label>
          <input
            id="confirm-password"
            name="confirmPassword"
            type="password"
            autocomplete="off"
            required
          />
          <span
            id="confirm-password-error"
            class="error-msg"
            aria-live="polite"
          ></span>
        </div>

        <button type="submit" class="submit-btn">Submit</button>
      </form>

      <section id="high-five-panel" class="high-five creature-ending" hidden>
        <p id="creature-vow-quote" class="creature-vow-quote"></p>
        <p id="trap-note-text" class="trap-note-text"></p>
        <button type="button" id="reset-btn" class="reset-btn">
          Start Over
        </button>
      </section>
    </main>
  </body>
</html>
